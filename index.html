<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f8fd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="桃子专属考研政治" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="桃子专属考研政治 AI 学习平台 · 2007—2026 年 760 道真实真题、663 个知识点、AI 答疑与深度解析。打开即学，无需登录。"
    />
    <title>桃子专属考研政治 AI 学习平台</title>
    <script>
      // 首屏前应用已保存的主题，避免闪烁。
      ;(() => {
        try {
          const parse = (key) => {
            const raw = JSON.parse(localStorage.getItem(key) || 'null')
            if (!raw) return null
            return raw && raw.data ? raw.data : raw
          }
          const saved = parse('echo.settings.v1') || parse('polis.settings')
          const mode = saved?.theme || 'system'
          const dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.font = saved?.fontSize === 'compact' ? 'compact' : 'comfortable'
          document.documentElement.dataset.motion = saved?.motion === false ? 'off' : 'on'
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
